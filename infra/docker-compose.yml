# Infraestructura compartida: broker de mensajes y almacén de archivos.
# Uso: cd infra && cp .env.example .env && docker compose up -d
services:
  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"     # protocolo AMQP (los servicios)
      - "15672:15672"   # panel web de administración
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?define RABBITMQ_USER en infra/.env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?define RABBITMQ_PASSWORD en infra/.env}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"     # API compatible con S3
      - "9001:9001"     # consola web
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?define MINIO_ROOT_USER en infra/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?define MINIO_ROOT_PASSWORD en infra/.env}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 10s
      retries: 5

volumes:
  rabbitmq_data:
  minio_data:
